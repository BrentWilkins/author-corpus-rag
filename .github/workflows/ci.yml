name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Install uv and Python 3.14
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          python-version: "3.14"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen --all-extras --dev

      - name: Audit locked dependencies
        run: uv --preview-features audit-command audit --frozen

      - name: Check formatting
        run: uv run --frozen ruff format --check .

      - name: Lint
        run: uv run --frozen ruff check .

      - name: Type-check
        run: uv run --frozen mypy

      - name: Test
        run: uv run --frozen pytest -p no:cacheprovider -q

      - name: Smoke-test the notebook without private output
        run: uv run --frozen python scripts/smoke_notebook.py

      - name: Build release artifacts
        run: uv build --out-dir /tmp/author-corpus-rag-dist
