[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "author-corpus-rag"
version = "0.1.0"
description = "Source-agnostic ingestion and RAG analysis for an author's corpus"
readme = "README.md"
authors = [{ name = "Brent Wilkins" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "llama-index-core>=0.14.23",
    "llama-index-readers-file>=0.6.0",
    "llama-index-retrievers-bm25>=0.7.1",
    "pydantic>=2.13",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
]

[project.scripts]
author-corpus = "author_corpus.cli:main"

[project.urls]
Repository = "https://github.com/BrentWilkins/author-corpus-rag"
Issues = "https://github.com/BrentWilkins/author-corpus-rag/issues"

[project.optional-dependencies]
local = [
    "llama-index-embeddings-huggingface>=0.7.0",
    "openai>=2.45",
    "torch>=2.9",
]
ui = [
    "gradio>=6.20,<7",
]

[dependency-groups]
dev = [
    "ipykernel>=7.0",
    "ipywidgets>=8.1",
    "mypy>=1.19",
    "nbclient>=0.10.2",
    "nbstripout>=0.8.2",
    "pre-commit>=4.6.1",
    "pytest>=9.0",
    "ruff>=0.14",
    "types-pyyaml>=6.0.12.20260724",
]

[tool.hatch.build.targets.wheel]
packages = ["src/author_corpus"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/README.md",
]

[tool.uv]
exclude-newer = "2 weeks"

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 130
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "D", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S108"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
